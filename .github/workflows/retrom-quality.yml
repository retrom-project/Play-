name: Retrom Core Quality
on:
  pull_request:
    branches: [retrom/g83700b2c31e5]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python3 -B -m unittest discover -s .github/rpg-runtime -p 'test_*.py'
      - name: Build and test pinned WebAssembly core
        run: |
          mkdir "$RUNNER_TEMP/play-candidate"
          bash .github/rpg-runtime/build-candidate.sh "$RUNNER_TEMP/play-candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: play-core-candidate
          path: ${{ runner.temp }}/play-candidate
