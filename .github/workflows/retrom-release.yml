name: Retrom Core Release
on:
  push:
    tags: [retrom-core-g83700b2c31e5-r*]
permissions:
  contents: write
concurrency:
  group: retrom-core-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate immutable tag and maintenance branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^retrom-core-g83700b2c31e5-r[1-9][0-9]*(-rc\.[1-9][0-9]*)?$ ]]
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-list -n 1 "refs/tags/$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git fetch --no-tags origin retrom/g83700b2c31e5
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
          git merge-base --is-ancestor 83700b2c31e593bc94e845b4b31b797be84dda59 "$GITHUB_SHA"
      - run: python3 -B -m unittest discover -s .github/rpg-runtime -p 'test_*.py'
      - name: Build release assets
        run: |
          mkdir "$RUNNER_TEMP/play-candidate"
          bash .github/rpg-runtime/build-candidate.sh "$RUNNER_TEMP/play-candidate"
          python3 .github/rpg-runtime/release.py --candidate "$RUNNER_TEMP/play-candidate" --output "$RUNNER_TEMP/play-release" --tag "$GITHUB_REF_NAME"
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/play-release/"* --verify-tag --generate-notes "${flags[@]}"
